<form [formGroup]="form" (ngSubmit)="submit()">
  <h2 class="h5 mb-3">Add Medicine</h2>

  <div class="row g-3">
    <div class="col-md-6">
      <label for="fullName" class="form-label">Full Name</label>
      <input
        id="fullName"
        type="text"
        class="form-control"
        [class.is-invalid]="f['fullName'].invalid && f['fullName'].touched"
        formControlName="fullName"
        placeholder="e.g. Paracetamol 500mg"
      />
      <div class="invalid-feedback">Full name is required.</div>
    </div>

    <div class="col-md-6">
      <label for="brand" class="form-label">Brand</label>
      <input
        id="brand"
        type="text"
        class="form-control"
        [class.is-invalid]="f['brand'].invalid && f['brand'].touched"
        formControlName="brand"
        placeholder="e.g. Calpol"
      />
      <div class="invalid-feedback">Brand is required.</div>
    </div>

    <div class="col-md-4">
      <label for="expiryDate" class="form-label">Expiry Date</label>
      <input
        id="expiryDate"
        type="date"
        class="form-control"
        [class.is-invalid]="f['expiryDate'].invalid && f['expiryDate'].touched"
        formControlName="expiryDate"
      />
      <div class="invalid-feedback">Expiry date is required.</div>
    </div>

    <div class="col-md-4">
      <label for="quantity" class="form-label">Quantity</label>
      <input
        id="quantity"
        type="number"
        min="0"
        step="1"
        class="form-control"
        [class.is-invalid]="f['quantity'].invalid && f['quantity'].touched"
        formControlName="quantity"
      />
      <div class="invalid-feedback">Quantity must be 0 or more.</div>
    </div>

    <div class="col-md-4">
      <label for="price" class="form-label">Price</label>
      <input
        id="price"
        type="number"
        min="0"
        step="0.01"
        class="form-control"
        [class.is-invalid]="f['price'].invalid && f['price'].touched"
        formControlName="price"
      />
      <div class="invalid-feedback">Price must be 0 or more.</div>
    </div>

    <div class="col-12">
      <label for="notes" class="form-label">Notes</label>
      <textarea id="notes" rows="2" class="form-control" formControlName="notes" placeholder="Optional notes"></textarea>
    </div>
  </div>

  @if (errorMessage) {
    <div class="alert alert-danger mt-3 mb-0">{{ errorMessage }}</div>
  }

  <div class="d-flex justify-content-end gap-2 mt-3">
    <button type="button" class="btn btn-outline-secondary" (click)="cancel()">Cancel</button>
    <button type="submit" class="btn btn-primary" [disabled]="submitting">
      {{ submitting ? 'Saving…' : 'Save Medicine' }}
    </button>
  </div>
</form>
